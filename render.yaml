# Render Blueprint — auto-provisions the web service + PostgreSQL
# Push this to GitHub and connect to Render dashboard.

databases:
  - name: railmitra-db
    plan: free
    databaseName: railmitra
    user: railmitra

services:
  - type: web
    name: railmitra-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railmitra-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: railmitra-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
