# Render Blueprint — auto-provisions the web service
# Push this to GitHub and connect to Render dashboard.

services:
  - type: web
    name: railmitra-api
    runtime: node
    plan: free
    rootDir: server
    autoDeploy: false
    branch: main
    healthCheckPath: /api/health
    buildCommand: npm ci --ignore-scripts && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: ADMIN_TOKEN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
