# =============================================================================
# RailMitra Backend — CI/CD Pipeline (Render Deployment)
# Triggers on pushes/PRs touching the server/ directory.
# Lints, tests with real Postgres, validates Docker, and deploys to Render.
#
# NOTE: Render deploys via its native Node.js builder using render.yaml,
# NOT from a Docker registry. The Docker step here is validation-only
# (ensures the Dockerfile stays buildable for future containerization).
# =============================================================================

name: 🚄 Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'


jobs:
  # ---- Job 1: Lint & Type-check ----
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ---- Job 2: Unit & Integration Tests ----
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: railmitra_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: railmitra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://railmitra_test:test_password@localhost:5432/railmitra_test
      DIRECT_URL: postgresql://railmitra_test:test_password@localhost:5432/railmitra_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: Run tests
        run: npm test --if-present

  # ---- Job 3: Docker Build Validation (NOT pushed — Render uses native Node) ----
  docker-validate:
    name: 🐳 Dockerfile Validation
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (validation only — never pushed)
        run: docker build -t railmitra-api:validate ./server

      - name: Verify image builds and runs
        run: |
          # Quick sanity: make sure Node is present in the image
          docker run --rm railmitra-api:validate node --version

  # ---- Job 4: Deploy to Render ----
  # Render pulls directly from the GitHub repo and builds using render.yaml.
  # This step just triggers the deploy hook so Render redeploys after CI passes,
  # rather than relying on Render's auto-deploy (which skips our test gate).
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Skipping deploy trigger: RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_URL" \
            --fail --silent --show-error
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Wait for Render to start building
        run: sleep 5

      - name: Smoke test (wake up and verify health)
        run: |
          echo "Waiting for Render to deploy (cold start can take ~60s)..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://railmitra-api.onrender.com/api/health || echo "000")
            echo "  Attempt $i/12: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Server is healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ Server did not respond with 200 within 2 minutes. It may still be deploying."
          # Don't fail the pipeline — Render free tier can take longer
          exit 0
