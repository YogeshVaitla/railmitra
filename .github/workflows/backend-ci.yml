name: Deploy reviewed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy exact reviewed commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/deploy-reviewed.cjs
      - name: Verify deployed version and health
        env:
          HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/smoke-release.cjs
