name: Release checks
on:
  push:
    branches: [main, pre-prod, develop]
  pull_request:
    branches: [main, pre-prod]
  workflow_call:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - run: node scripts/check-secrets.cjs
      - run: npx expo export --platform android --output-dir /tmp/railmitra-export
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: railmitra_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: railmitra_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://railmitra_test:test_password@localhost:5432/railmitra_test
      DIRECT_URL: postgresql://railmitra_test:test_password@localhost:5432/railmitra_test
      TEST_DATABASE_URL: postgresql://railmitra_test:test_password@localhost:5432/railmitra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm test -- --runInBand
        working-directory: server
      - run: docker build -t railmitra-api:check ./server
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts
      - run: npx expo prebuild --platform android --no-install
      - run: node scripts/check-native.cjs
      - run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
        working-directory: android
      - run: node scripts/check-native.cjs --merged
      - uses: actions/upload-artifact@v4
        with:
          name: android-validation-only
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7
