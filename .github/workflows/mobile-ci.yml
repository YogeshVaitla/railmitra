# =============================================================================
# RailMitra Mobile App — CI/CD Pipeline
# Triggers on pushes/PRs touching the React Native app code.
# Lints, type-checks, and triggers EAS builds.
# =============================================================================

name: 📱 Mobile CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'components/**'
      - 'services/**'
      - 'hooks/**'
      - 'constants/**'
      - 'models/**'
      - 'plugins/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'services/**'
      - 'hooks/**'
      - 'constants/**'


jobs:
  # ---- Job 1: Lint & Type-check ----
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ---- Job 2: Unit Tests ----
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  # NOTE: EAS build and OTA jobs have been intentionally removed.
  # This repo builds Android APKs locally via Gradle instead of using EAS in CI.
